<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Clear Cache Tool</title>
    <style>
        body {
            font-family: 'Microsoft YaHei', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0;
        }

        .container {
            background: white;
            padding: 3rem;
            border-radius: 1rem;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            max-width: 500px;
            text-align: center;
        }

        h1 {
            color: #333;
            margin-bottom: 1rem;
        }

        .btn {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 1rem 2rem;
            border-radius: 0.5rem;
            font-size: 1.1rem;
            cursor: pointer;
            margin: 0.5rem;
            transition: transform 0.2s;
        }

        .btn:hover {
            transform: translateY(-2px);
        }

        .status {
            margin-top: 1.5rem;
            padding: 1rem;
            border-radius: 0.5rem;
            display: none;
        }

        .status.success {
            background: #d4edda;
            color: #155724;
            display: block;
        }

        .status.error {
            background: #f8d7da;
            color: #721c24;
            display: block;
        }

        ul {
            text-align: left;
            color: #666;
            line-height: 1.8;
        }
    </style>
</head>

<body>
    <div class="container">
        <h1>🧹 Context Reminder - Cache Clearing Tool</h1>
        <p>If the app is malfunctioning, use this tool to clear all cache</p>

        <button class="btn" onclick="clearAllCache()">Clear All Cache</button>
        <button class="btn" onclick="goToApp()">Back to App</button>

        <div id="status" class="status"></div>

        <div style="margin-top: 2rem; text-align: left;">
            <h3>What will be cleared:</h3>
            <ul>
                <li>Service Worker cache</li>
                <li>IndexedDB database</li>
                <li>localStorage data</li>
                <li>Browser cache</li>
            </ul>
            <p style="color: #dc3545; font-weight: bold;">⚠️ Warning: This will delete all local data!</p>
        </div>
    </div>

    <script>
        async function clearAllCache() {
            const status = document.getElementById('status');
            status.className = 'status';
            status.textContent = 'Clearing...';
            status.style.display = 'block';

            try {
                // Unregister service workers
                if ('serviceWorker' in navigator) {
                    const registrations = await navigator.serviceWorker.getRegistrations();
                    for (const registration of registrations) {
                        await registration.unregister();
                    }
                }

                // Clear all caches
                if ('caches' in window) {
                    const cacheNames = await caches.keys();
                    await Promise.all(cacheNames.map(name => caches.delete(name)));
                }

                // Delete IndexedDB
                const databases = await indexedDB.databases();
                for (const db of databases) {
                    indexedDB.deleteDatabase(db.name);
                }

                // Clear localStorage
                localStorage.clear();

                // Clear sessionStorage
                sessionStorage.clear();

                status.className = 'status success';
                status.textContent = '✅ Cache cleared! Redirecting to app in 3 seconds...';

                setTimeout(() => {
                    window.location.href = '/index.html';
                }, 3000);

            } catch (error) {
                status.className = 'status error';
                status.textContent = '❌ Clear failed: ' + error.message;
            }
        }

        function goToApp() {
            window.location.href = '/index.html';
        }
    </script>
</body>

</html>
