<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fix AI Insights Data</title>
    <style>
        body {
            font-family: 'Microsoft YaHei', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0;
            padding: 2rem;
        }

        .container {
            background: white;
            padding: 3rem;
            border-radius: 1rem;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            max-width: 600px;
            text-align: center;
        }

        h1 {
            color: #333;
            margin-bottom: 1rem;
        }

        .btn {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 1rem 2rem;
            border-radius: 0.5rem;
            font-size: 1.1rem;
            cursor: pointer;
            margin: 0.5rem;
            transition: transform 0.2s;
        }

        .btn:hover {
            transform: translateY(-2px);
        }

        .btn-secondary {
            background: #6c757d;
        }

        .status {
            margin-top: 1.5rem;
            padding: 1rem;
            border-radius: 0.5rem;
            display: none;
        }

        .status.success {
            background: #d4edda;
            color: #155724;
            display: block;
        }

        .status.error {
            background: #f8d7da;
            color: #721c24;
            display: block;
        }

        .info {
            background: #d1ecf1;
            color: #0c5460;
            padding: 1rem;
            border-radius: 0.5rem;
            margin: 1rem 0;
        }
    </style>
</head>

<body>
    <div class="container">
        <h1>🔧 AI Insights Data Repair Tool</h1>

        <div class="info">
            <strong>Issue Detected:</strong><br>
            AI Insights data corrupted (missing suggestedAction)<br><br>
            This tool will clear the corrupted insights data and regenerate correct demo data.
        </div>

        <button class="btn" onclick="fixInsights()">Fix AI Insights Data</button>
        <button class="btn btn-secondary" onclick="goToApp()">Back to App</button>

        <div id="status" class="status"></div>
    </div>

    <script>
        async function fixInsights() {
            const status = document.getElementById('status');
            status.className = 'status';
            status.textContent = 'Fixing...';
            status.style.display = 'block';

            try {
                //Open IndexedDB
                const request = indexedDB.open('ContextReminderDB', 1);

                request.onsuccess = (event) => {
                    const db = event.target.result;

                    // Clear insights store
                    const transaction = db.transaction(['insights'], 'readwrite');
                    const store = transaction.objectStore('insights');
                    const clearRequest = store.clear();

                    clearRequest.onsuccess = () => {
                        // Clear the localStorage flag so demo data will be recreated
                        localStorage.removeItem('insights_interacted');

                        status.className = 'status success';
                        status.textContent = '✅ AI Insights data fixed! Redirecting in 3 seconds...';

                        setTimeout(() => {
                            window.location.href = '/index.html';
                        }, 3000);
                    };

                    clearRequest.onerror = () => {
                        status.className = 'status error';
                        status.textContent = '❌ Fix failed: ' + clearRequest.error;
                    };
                };

                request.onerror = () => {
                    status.className = 'status error';
                    status.textContent = '❌ Unable to open database: ' + request.error;
                };

            } catch (error) {
                status.className = 'status error';
                status.textContent = '❌ Fix failed: ' + error.message;
            }
        }

        function goToApp() {
            window.location.href = '/index.html';
        }
    </script>
</body>

</html>
