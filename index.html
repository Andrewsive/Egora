<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes">
    <meta name="description" content="Context Reminder - Smart context-aware reminders powered by AI">
    <meta name="theme-color" content="#0f172a">
    <title>Context Reminder</title>

    <!-- PWA Manifest -->
    <link rel="manifest" href="manifest.json">

    <!-- Styles -->
    <link rel="stylesheet" href="styles.css">

    <!-- Preload critical resources -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>

<body>
    <!-- App Container -->
    <div id="app" class="app-container">

        <!-- Header -->
        <header class="app-header">
            <div class="header-content">
                <h1 class="app-title">
                    <span class="title-icon">🧠</span>
                    <span class="title-text">Context Reminder</span>
                </h1>
                <button class="header-btn" id="settingsBtn" aria-label="Settings">
                    ⚙️
                </button>
            </div>
        </header>

        <!-- Main Content Views -->
        <main class="main-content">

            <!-- Timeline View -->
            <section id="timelineView" class="view-container active">
                <div class="view-header">
                    <h2 class="view-title">Timeline</h2>
                    <button class="icon-btn" id="refreshTimelineBtn" aria-label="Refresh">🔄</button>
                </div>
                <div id="timelineContent" class="timeline-content">
                    <!-- Timeline events will be rendered here -->
                    <div class="loading-placeholder">
                        <div class="spinner"></div>
                        <p>Loading...</p>
                    </div>
                </div>
            </section>

            <!-- Reminders View -->
            <section id="remindersView" class="view-container">
                <div class="view-header">
                    <h2 class="view-title">我的提醒</h2>
                    <button class="icon-btn primary" id="addReminderBtn" aria-label="添加提醒">➕</button>
                </div>
                <div class="search-bar">
                    <input type="text" id="searchReminders" placeholder="🔍 搜索提醒..." class="search-input">
                </div>
                <div id="remindersContent" class="reminders-content">
                    <!-- Reminder cards will be rendered here -->
                </div>
            </section>

            <!-- Insights View -->
            <section id="insightsView" class="view-container">
                <div class="view-header">
                    <h2 class="view-title">AI洞察</h2>
                    <span class="badge" id="insightsBadge">0</span>
                </div>
                <div id="insightsContent" class="insights-content">
                    <!-- AI insights will be rendered here -->
                </div>
            </section>

        </main>

        <!-- Bottom Navigation -->
        <nav class="bottom-nav">
            <button class="nav-btn active" data-view="timeline" aria-label="Timeline">
                <span class="nav-icon">📅</span>
                <span class="nav-label">Timeline</span>
            </button>
            <button class="nav-btn" data-view="reminders" aria-label="Reminders">
                <span class="nav-icon">🔔</span>
                <span class="nav-label">Reminders</span>
            </button>
            <button class="nav-btn" data-view="insights" aria-label="Insights">
                <span class="nav-icon">💡</span>
                <span class="nav-label">Insights</span>
            </button>
        </nav>

    </div>

    <!-- Modal: Add/Edit Reminder -->
    <div id="reminderModal" class="modal">
        <div class="modal-overlay"></div>
        <div class="modal-content">
            <div class="modal-header">
                <h3 class="modal-title" id="modalTitle">创建提醒</h3>
                <button class="close-btn" id="closeModalBtn">✕</button>
            </div>
            <div class="modal-body">
                <form id="reminderForm">
                    <div class="form-group">
                        <label for="reminderTitle">提醒我…</label>
                        <input type="text" id="reminderTitle" class="form-input" placeholder="例如：买牛奶" required>
                    </div>
                    <div class="form-group">
                        <label for="reminderContext">当我…</label>
                        <textarea id="reminderContext" class="form-input" rows="3" placeholder="例如：在超市的时候"
                            required></textarea>
                    </div>
                    <div class="form-group">
                        <label for="reminderPriority">优先级</label>
                        <select id="reminderPriority" class="form-input">
                            <option value="low">低</option>
                            <option value="medium" selected>中</option>
                            <option value="high">高</option>
                        </select>
                    </div>
                    <div class="form-actions">
                        <button type="button" class="btn btn-secondary" id="cancelModalBtn">取消</button>
                        <button type="submit" class="btn btn-primary">保存</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <!-- Modal: Event Details -->
    <div id="eventModal" class="modal">
        <div class="modal-overlay"></div>
        <div class="modal-content">
            <div class="modal-header">
                <h3 class="modal-title">事件详情</h3>
                <button class="close-btn" id="closeEventModalBtn">✕</button>
            </div>
            <div class="modal-body" id="eventModalBody">
                <!-- Event details will be rendered here -->
            </div>
        </div>
    </div>

    <!-- Notification Permission Prompt -->
    <div id="notificationPrompt" class="notification-prompt hidden">
        <div class="prompt-content">
            <div class="prompt-icon">🔔</div>
            <h3>启用通知</h3>
            <p>允许应用发送通知，以便及时提醒您</p>
            <div class="prompt-actions">
                <button class="btn btn-secondary" id="skipNotificationBtn">稍后</button>
                <button class="btn btn-primary" id="enableNotificationBtn">启用</button>
            </div>
        </div>
    </div>

    <!-- Toast Notification -->
    <div id="toast" class="toast hidden">
        <span id="toastMessage"></span>
    </div>

    <!-- Connection Status Indicator -->
    <div id="connectionStatus" class="connection-status">
        <span class="status-dot"></span>
        <span class="status-text">连接中...</span>
    </div>


    <!-- Settings Modal -->
    <div id="settingsModal" class="modal">
        <div class="modal-overlay"></div>
        <div class="modal-container">
            <div class="modal-header">
                <h2>设置</h2>
                <button class="icon-btn" id="closeSettingsBtn">
                    <svg viewBox="0 0 24 24" width="24" height="24">
                        <path
                            d="M19 6.41L17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z"
                            fill="currentColor" />
                    </svg>
                </button>
            </div>
            <div class="modal-body">
                <div class="settings-section">
                    <h3>📦 数据管理</h3>

                    <div class="setting-item">
                        <div class="setting-info">
                            <div class="setting-title">导出数据</div>
                            <div class="setting-desc">将所有提醒、时间线和洞察导出为JSON文件</div>
                        </div>
                        <button class="btn btn-primary" id="exportDataBtn">
                            📥 导出
                        </button>
                    </div>

                    <div class="setting-item">
                        <div class="setting-info">
                            <div class="setting-title">导入数据</div>
                            <div class="setting-desc">从JSON文件恢复数据</div>
                        </div>
                        <div class="file-input-wrapper">
                            <input type="file" id="importDataInput" accept=".json" style="display: none;">
                            <button class="btn btn-secondary"
                                onclick="document.getElementById('importDataInput').click()">
                                📤 导入
                            </button>
                        </div>
                    </div>

                    <div class="setting-item">
                        <div class="setting-info">
                            <div class="setting-title">清除所有数据</div>
                            <div class="setting-desc">删除所有本地数据（不可恢复）</div>
                        </div>
                        <button class="btn btn-danger" id="clearDataBtn">
                            🗑️ 清除
                        </button>
                    </div>
                </div>

                <div class="settings-section">
                    <h3>ℹ️ 关于</h3>
                    <div class="setting-item">
                        <div class="setting-info">
                            <div class="setting-title">版本信息</div>
                            <div class="setting-desc">情境提醒系统 v1.0.0</div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Reminder Action Modal -->
    <div id="reminderActionModal" class="modal reminder-modal">
        <div class="modal-overlay"></div>
        <div class="modal-container">
            <div class="modal-header">
                <div class="reminder-badge">
                    🔔 提醒触发
                </div>
            </div>
            <div class="modal-body">
                <h2 id="reminderModalTitle" class="reminder-title">提醒标题</h2>
                <p id="reminderModalContext" class="reminder-context">情境描述</p>

                <div class="reminder-actions">
                    <button class="btn btn-primary btn-large" id="ackReminderBtn">
                        ✅ 确认
                    </button>
                    <button class="btn btn-warning btn-large" id="snoozeReminderBtn">
                        ⏰ 稍后
                    </button>
                    <button class="btn btn-danger btn-large" id="dismissReminderBtn">
                        ❌ 拒绝
                    </button>
                </div>
            </div>
        </div>
    </div>

    <!-- Scripts -->
    <script src="modules/storage.js"></script>
    <script src="modules/websocket.js"></script>
    <script src="modules/notifications.js"></script>
    <script src="modules/timeline.js"></script>
    <script src="modules/reminders.js"></script>
    <script src="modules/insights.js"></script>
    <script src="modules/data-manager.js"></script>
    <script src="app.js"></script>
</body>

</html>
